[project]
name = "sonar-backend"
version = "0.1.0"
description = "FastAPI bridge for Marine Debris Sonar AI — HTTP concerns only"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "python-multipart",
  "jinja2",
  "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
