# Render Blueprint for SONARX (AI-Powered Underwater Intelligence)
# Supports full PyTorch + YOLOv8n inference and Vite frontend
services:
  - type: web
    name: sonarx-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH='ml:.' uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: "ml:."
      - key: CORS_ORIGINS
        value: "*"
      - key: ACTIVE_MODEL_VERSION
        value: drishti-ss_yolov8n_e30_final
      - key: CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: DEVICE
        value: cpu

  - type: web
    name: sonarx-frontend
    env: static
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sonarx-backend
          property: host
