# Render Blueprint for SONARX Backend (AI-Powered Underwater Intelligence)
# PyTorch + YOLOv8n inference on Render Free Docker Tier
services:
  - type: web
    name: sonarx-backend
    env: docker
    dockerfilePath: Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: "ml:."
      - key: CORS_ORIGINS
        value: "*"
      - key: ACTIVE_MODEL_VERSION
        value: drishti-ss_yolov8n_e30_final
      - key: CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: DEVICE
        value: cpu
